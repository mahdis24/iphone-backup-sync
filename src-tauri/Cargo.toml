[package]
name = "iphone-backup-sync"
version = "0.4.1"
description = "High-reliability Windows MTP/WPD photo & video backup tool for iOS devices"
authors = ["Mahdi Salek <https://mahdis24.tech>"]
license = "MIT"
repository = "https://github.com/mahdis24/iphone-backup-sync"
homepage = "https://mahdis24.tech/iphone-backup-sync/"
readme = "../README.md"
edition = "2024"

[lib]
name = "iphone_backup_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
windows = { version = "0.58", features = [
    "Win32_Devices_PortableDevices",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell_PropertiesSystem",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
